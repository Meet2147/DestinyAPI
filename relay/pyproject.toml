[project]
name = "aurascan-relay"
version = "1.0.0"
description = "Holds the Anthropic key and decides who may take a reading"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
