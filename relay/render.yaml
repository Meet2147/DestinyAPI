databases:
  - name: aurascan-relay-db
    databaseName: aurascan
    plan: free

services:
  - type: web
    name: aurascan-relay
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurascan-relay-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ANTHROPIC_API_KEY
        sync: false            # set in the dashboard; never commit it
      - key: FREE_READINGS
        value: "7"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_DAY
        value: "60"
      - key: DAILY_SPEND_CAP_USD
        value: "50"
