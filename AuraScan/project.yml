# XcodeGen spec — `brew install xcodegen && xcodegen generate` produces
# AuraScan.xcodeproj. The generated project is intentionally not committed:
# the spec is the source of truth, which keeps merges free of pbxproj conflicts.
name: AuraScan
options:
  bundleIdPrefix: ai.aurascan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""

targets:
  AuraScan:
    type: application
    platform: iOS
    sources:
      - path: AuraScan
        excludes:
          - "Resources/Info.plist"
    resources:
      - AuraScan/Resources
    info:
      path: AuraScan/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aurascan.app
        INFOPLIST_FILE: AuraScan/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO

  AuraScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AuraScanTests
    dependencies:
      - target: AuraScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aurascan.app.tests

schemes:
  AuraScan:
    build:
      targets:
        AuraScan: all
    run:
      config: Debug
      environmentVariables:
        # Optional: seeds a key for simulator runs without touching the Keychain.
        - variable: AURASCAN_API_KEY
          value: ""
          isEnabled: false
    test:
      config: Debug
      targets:
        - AuraScanTests
