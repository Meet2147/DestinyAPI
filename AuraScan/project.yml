# XcodeGen spec — the source of truth for the Xcode project.
# Generate with ./bootstrap.sh (or `xcodegen generate`).
# The .xcodeproj is intentionally gitignored: the spec is what gets reviewed,
# and merges stay free of pbxproj conflicts.
name: AuraScan
options:
  bundleIdPrefix: ai.aurascan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # The code is written for Swift 6 isolation (MainActor view models,
    # nonisolated(unsafe) on the AVCaptureSession, explicit `any` on
    # existentials). If the first build drowns in concurrency diagnostics,
    # drop to SWIFT_VERSION: "5.0" to get it running, then step back up.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Needed for physical-device builds. It lives here rather than being picked
    # in Xcode's Signing tab because `xcodegen generate` rewrites the project
    # and would discard that choice every time. A Team ID is not a secret - it
    # ships inside every signed app.
    DEVELOPMENT_TEAM: C9NLF34677

targets:
  AuraScan:
    type: application
    platform: iOS
    sources:
      # .xcassets under this path is picked up as a resource automatically.
      # Info.plist is excluded because it is referenced by INFOPLIST_FILE
      # instead — listing it in both places makes Xcode copy it into the
      # bundle a second time.
      - path: AuraScan
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aurascan.app
        PRODUCT_NAME: AuraScan
        INFOPLIST_FILE: AuraScan/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  AuraScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AuraScanTests
    dependencies:
      - target: AuraScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aurascan.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AuraScan:
    build:
      targets:
        AuraScan: all
        AuraScanTests: [test]
    run:
      config: Debug
      environmentVariables:
        # Seeds an API key for simulator runs without touching the Keychain.
        # Enable it in Xcode's scheme editor and paste a key.
        - variable: AURASCAN_API_KEY
          value: ""
          isEnabled: false
    test:
      config: Debug
      targets:
        - AuraScanTests
